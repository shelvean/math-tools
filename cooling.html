<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive Newton's Law of Cooling visualization with realistic object photographs, jet colormap temperature overlay, steam effects, and real-time numerical simulation.">
  <meta name="keywords" content="Newton's Law of Cooling, Temperature, Heat Transfer, Differential Equations, ODE, Simulation, Numerical Methods">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LEQE004C92"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LEQE004C92');
  </script>
  <title>Newton's Law of Cooling</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --surface: #ffffff;
      --bg: #f0f4f8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .main-container { max-width: 1400px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.7rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    header p { font-size: 0.95rem; color: var(--text-muted); }

    .equation-bar {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .equation-bar .katex { font-size: 1.15rem; }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* --- Controls --- */
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 24px;
    }

    .controls h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 700;
    }

    .control-group { margin-bottom: 18px; }
    .control-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .control-group label span.unit { font-weight: 400; color: var(--text-muted); }

    .control-group select,
    .control-group input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      color: var(--text);
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .control-group select:focus,
    .control-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 18px; border: none; border-radius: 8px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s; width: 100%;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca; }
    .btn-danger:hover { background: #fee2e2; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }

    .speed-control { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    .speed-control input[type="range"] { flex: 1; accent-color: var(--primary); }
    .speed-label {
      font-size: 0.78rem; color: var(--text-muted); min-width: 28px;
      text-align: right; font-weight: 600;
    }

    /* --- Right Panel --- */
    .viz-panel { display: flex; flex-direction: column; gap: 20px; }

    /* --- Object Display --- */
    .object-display {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .ambient-bg {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      padding: 30px;
      transition: background-color 0.8s ease;
    }

    .ambient-label {
      position: absolute; top: 12px; right: 16px;
      font-size: 0.75rem; font-weight: 600;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.25);
      padding: 4px 10px; border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .ambient-label.dark-text {
      color: rgba(0,0,0,0.6);
      background: rgba(255,255,255,0.5);
    }

    /* --- Object Scene with Photo --- */
    .object-scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .temp-badge {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
      margin-bottom: 12px;
      z-index: 5;
    }

    /* Photo container with color overlay */
    .photo-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      border: 3px solid rgba(255,255,255,0.3);
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.4s;
    }

    /* Jet color overlay */
    .photo-overlay {
      position: absolute;
      inset: 0;
      mix-blend-mode: color;
      transition: background-color 0.3s;
      pointer-events: none;
      z-index: 2;
    }

    /* Subtle luminance overlay for intensity */
    .photo-glow {
      position: absolute;
      inset: 0;
      mix-blend-mode: soft-light;
      transition: background-color 0.3s;
      pointer-events: none;
      z-index: 3;
      opacity: 0.4;
    }

    /* SVG fallback (hidden when photo loads) */
    .photo-wrapper svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .object-name-label {
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 5;
    }

    /* --- Steam Particles --- */
    .steam-container {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 100px;
      pointer-events: none;
      overflow: visible;
      z-index: 10;
    }

    .steam-particle {
      position: absolute;
      bottom: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      filter: blur(4px);
      animation: steamRise linear infinite;
      opacity: 0;
    }

    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(0) translateX(0) scale(0.3); }
      10% { opacity: 0.8; }
      50% { opacity: 0.5; transform: translateY(-40px) translateX(calc(var(--drift) * 0.5)) scale(0.8); }
      100% { opacity: 0; transform: translateY(-90px) translateX(var(--drift)) scale(1.3); }
    }

    .frost-particle {
      position: absolute;
      bottom: 0;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(180,220,255,0.8);
      filter: blur(1.5px);
      animation: frostFall linear infinite;
      opacity: 0;
    }

    @keyframes frostFall {
      0% { opacity: 0; transform: translateY(0) translateX(0) scale(0.5); }
      15% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(50px) translateX(var(--drift)) scale(0.2); }
    }

    /* Heat shimmer effect */
    .heat-shimmer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(
        0deg,
        transparent 0%,
        rgba(255,200,100,0.06) 30%,
        transparent 60%
      );
      animation: shimmer 2s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* --- Graph --- */
    .graph-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    /* --- Info Cards --- */
    .info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .info-card .value { font-size: 1.35rem; font-weight: 700; color: var(--primary); }
    .info-card .label {
      font-size: 0.72rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px;
    }

    /* --- Status bar --- */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      font-size: 0.78rem; color: var(--text-muted);
      background: #f8fafc;
      border-top: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #94a3b8; transition: background 0.3s;
    }
    .status-dot.running { background: #22c55e; animation: pulse 1.5s infinite; }
    .status-dot.paused { background: #f59e0b; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* --- Color Scale Legend --- */
    .color-legend {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    .color-legend span { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
    .color-bar {
      flex: 1; height: 10px; border-radius: 5px;
      background: linear-gradient(to right,
        #00008B, #0000FF, #0080FF, #00FFFF,
        #00FF80, #00FF00, #80FF00, #FFFF00,
        #FF8000, #FF0000, #8B0000);
    }

    /* --- Presets pills --- */
    .presets-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .preset-pill {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 20px;
      border: 1.5px solid var(--border); background: #f8fafc;
      color: #475569; cursor: pointer; font-weight: 600; transition: all 0.2s;
    }
    .preset-pill:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
    .preset-pill.active { border-color: var(--primary); background: var(--primary); color: #fff; }

    .divider { height: 1px; background: var(--border); margin: 18px 0; }

    /* Credits */
    .photo-credit {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      z-index: 5;
    }
    .photo-credit a { color: rgba(255,255,255,0.65); text-decoration: none; }
    .photo-credit a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .controls { position: static; }
      .info-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .info-row { grid-template-columns: 1fr; }
      .ambient-bg { min-height: 260px; }
      .photo-wrapper { width: 150px; height: 150px; }
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.85rem; font-weight: 500;
      color: var(--primary); text-decoration: none;
      margin-bottom: 16px; transition: transform 0.2s;
    }
    .back-link:hover { transform: translateX(-3px); }
  </style>
</head>
<body>
  <div class="main-container">
    <a href="projects.html" class="back-link">&larr; Back to Differential Equations</a>

    <header>
      <h1>Newton's Law of Cooling</h1>
      <p>Real-time numerical simulation of heat transfer between an object and its environment</p>
    </header>

    <div class="equation-bar" id="equationBar"></div>

    <div class="layout">
      <!-- Left: Controls -->
      <aside class="controls">
        <h3>Object</h3>
        <div class="control-group">
          <label>Select Object</label>
          <select id="objectSelect">
            <option value="coffee">Coffee Mug</option>
            <option value="pizza">Pizza Slice</option>
            <option value="soup">Bowl of Soup</option>
            <option value="icecream">Ice Cream</option>
            <option value="metalrod">Metal Rod</option>
          </select>
        </div>
        <div class="presets-row" id="presetPills"></div>

        <div class="divider"></div>
        <h3>Parameters</h3>

        <div class="control-group">
          <label>Initial Temperature, <em>T</em><sub>0</sub> <span class="unit">(°C)</span></label>
          <input type="number" id="initTemp" value="90" step="1">
        </div>

        <div class="control-group">
          <label>Ambient Temperature, <em>T</em><sub>env</sub> <span class="unit">(°C)</span></label>
          <input type="number" id="ambientTemp" value="22" step="1">
        </div>

        <div class="control-group">
          <label>Cooling Constant, <em>k</em> <span class="unit">(min<sup>&minus;1</sup>)</span></label>
          <input type="number" id="kConstant" value="0.07" step="0.005" min="0.001">
        </div>

        <div class="input-row">
          <div class="control-group">
            <label>End Time <span class="unit">(min)</span></label>
            <input type="number" id="endTime" value="60" step="5" min="5">
          </div>
          <div class="control-group">
            <label>Time Step, <em>dt</em></label>
            <input type="number" id="dt" value="0.25" step="0.05" min="0.05">
          </div>
        </div>

        <div class="control-group">
          <label>Animation Speed</label>
          <div class="speed-control">
            <span class="speed-label">1&times;</span>
            <input type="range" id="speedSlider" min="1" max="20" value="5">
            <span class="speed-label" id="speedValue">5&times;</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="btn-row" style="grid-template-columns: 1fr;">
          <button class="btn btn-primary" id="startBtn" onclick="startSimulation()">&#9654; Start Simulation</button>
        </div>
        <div class="btn-row" style="margin-top: 8px;">
          <button class="btn btn-secondary" id="pauseBtn" onclick="togglePause()" disabled>&#10074;&#10074; Pause</button>
          <button class="btn btn-danger" id="resetBtn" onclick="resetSimulation()">&#8634; Reset</button>
        </div>
      </aside>

      <!-- Right: Visualization -->
      <div class="viz-panel">
        <!-- Object visualization -->
        <div class="object-display">
          <div class="color-legend">
            <span>Cold</span>
            <div class="color-bar"></div>
            <span>Hot</span>
          </div>
          <div class="ambient-bg" id="ambientBg">
            <div class="ambient-label" id="ambientLabel">Ambient: 22°C</div>
            <div class="object-scene" id="objectScene">
              <div class="steam-container" id="steamContainer"></div>
              <div class="temp-badge" id="tempBadge">90.0°C</div>
              <div class="photo-wrapper" id="photoWrapper">
                <img id="objectPhoto" src="" alt="Object" crossorigin="anonymous">
                <div class="photo-overlay" id="photoOverlay"></div>
                <div class="photo-glow" id="photoGlow"></div>
                <div class="heat-shimmer" id="heatShimmer"></div>
              </div>
              <div class="object-name-label" id="objectNameLabel">COFFEE MUG</div>
              <div class="photo-credit" id="photoCredit"></div>
            </div>
          </div>
          <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Ready — press Start to begin</span>
          </div>
        </div>

        <!-- Info cards -->
        <div class="info-row">
          <div class="info-card">
            <div class="value" id="infoCurrentTemp">—</div>
            <div class="label">Current Temp</div>
          </div>
          <div class="info-card">
            <div class="value" id="infoTime">—</div>
            <div class="label">Elapsed Time</div>
          </div>
          <div class="info-card">
            <div class="value" id="infoRate">—</div>
            <div class="label">Cooling Rate</div>
          </div>
        </div>

        <!-- Graph -->
        <div class="graph-card">
          <div id="plotDiv" style="width:100%;height:380px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  // ===== OBJECT PRESETS =====
  const PRESETS = {
    coffee:   {
      name: 'Coffee Mug', T0: 90, k: 0.07, Tamb: 22,
      photo: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400&h=400&fit=crop&crop=center&auto=format',
      credit: 'Photo by Unsplash'
    },
    pizza:    {
      name: 'Pizza Slice', T0: 75, k: 0.04, Tamb: 22,
      photo: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&h=400&fit=crop&crop=center&auto=format',
      credit: 'Photo by Unsplash'
    },
    soup:     {
      name: 'Bowl of Soup', T0: 85, k: 0.055, Tamb: 22,
      photo: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=400&h=400&fit=crop&crop=center&auto=format',
      credit: 'Photo by Unsplash'
    },
    icecream: {
      name: 'Ice Cream', T0: -15, k: 0.06, Tamb: 22,
      photo: 'https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=400&h=400&fit=crop&crop=center&auto=format',
      credit: 'Photo by Unsplash'
    },
    metalrod: {
      name: 'Metal Rod', T0: 250, k: 0.025, Tamb: 22,
      photo: 'https://images.unsplash.com/photo-1530982011887-3cc11cc85693?w=400&h=400&fit=crop&crop=center&auto=format',
      credit: 'Photo by Unsplash'
    },
  };

  // ===== STATE =====
  let simState = {
    running: false,
    paused: false,
    times: [],
    temps: [],
    analyticalTemps: [],
    currentTime: 0,
    currentTemp: 0,
    animFrame: null,
    lastFrameTime: 0,
  };

  // ===== JET COLORMAP =====
  function jetColor(t) {
    t = Math.max(0, Math.min(1, t));
    let r, g, b;
    if (t < 0.125) {
      r = 0; g = 0; b = 0.5 + t * 4;
    } else if (t < 0.375) {
      r = 0; g = (t - 0.125) * 4; b = 1;
    } else if (t < 0.625) {
      r = (t - 0.375) * 4; g = 1; b = 1 - (t - 0.375) * 4;
    } else if (t < 0.875) {
      r = 1; g = 1 - (t - 0.625) * 4; b = 0;
    } else {
      r = 1 - (t - 0.875) * 4; g = 0; b = 0;
    }
    return {
      r: Math.round(Math.max(0, Math.min(1, r)) * 255),
      g: Math.round(Math.max(0, Math.min(1, g)) * 255),
      b: Math.round(Math.max(0, Math.min(1, b)) * 255)
    };
  }

  function jetColorCSS(t) {
    const c = jetColor(t);
    return `rgb(${c.r},${c.g},${c.b})`;
  }

  function tempToJet(T) {
    const lo = -20, hi = 260;
    return (T - lo) / (hi - lo);
  }

  // ===== AMBIENT BACKGROUND COLOR =====
  function ambientBgColor(Tamb) {
    if (Tamb <= -10) return 'rgba(15, 23, 80, 0.55)';
    if (Tamb <= 0)   return 'rgba(30, 58, 138, 0.45)';
    if (Tamb <= 10)  return 'rgba(59, 130, 246, 0.25)';
    if (Tamb <= 18)  return 'rgba(147, 197, 253, 0.2)';
    if (Tamb <= 26)  return 'rgba(241, 245, 249, 0.6)';
    if (Tamb <= 35)  return 'rgba(253, 224, 71, 0.18)';
    if (Tamb <= 45)  return 'rgba(251, 191, 36, 0.25)';
    return 'rgba(239, 68, 68, 0.2)';
  }

  function ambientTextDark(Tamb) {
    return Tamb > 15 && Tamb < 35;
  }

  // ===== PHOTO MANAGEMENT =====
  function setPhoto(key) {
    const preset = PRESETS[key];
    const img = document.getElementById('objectPhoto');
    const credit = document.getElementById('photoCredit');

    img.onerror = function() {
      // On error, show a colored placeholder
      this.style.opacity = '0';
    };
    img.onload = function() {
      this.style.opacity = '1';
    };

    img.src = preset.photo;
    img.alt = preset.name;
    credit.innerHTML = preset.credit;
  }

  // ===== STEAM / FROST PARTICLES =====
  function updateParticles(T, Tamb) {
    const container = document.getElementById('steamContainer');
    container.innerHTML = '';
    const shimmer = document.getElementById('heatShimmer');

    const diff = T - Tamb;

    if (diff > 5) {
      // Steam particles
      const intensity = Math.min(1, diff / 100);
      const count = Math.round(4 + intensity * 14);
      shimmer.style.opacity = Math.min(0.8, intensity);

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'steam-particle';
        const size = 8 + Math.random() * 14 * intensity;
        const left = 20 + Math.random() * 120;
        const drift = (Math.random() - 0.5) * 50;
        const duration = 1.2 + Math.random() * 1.8;
        const delay = Math.random() * duration;
        p.style.cssText = `
          width:${size}px; height:${size}px;
          left:${left}px;
          --drift:${drift}px;
          animation-duration:${duration}s;
          animation-delay:${delay}s;
          background:rgba(255,255,255,${0.25 + intensity * 0.45});
        `;
        container.appendChild(p);
      }
    } else if (diff < -5) {
      // Frost particles
      shimmer.style.opacity = '0';
      const intensity = Math.min(1, Math.abs(diff) / 40);
      const count = Math.round(4 + intensity * 10);
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'frost-particle';
        const left = 15 + Math.random() * 130;
        const drift = (Math.random() - 0.5) * 35;
        const duration = 1.8 + Math.random() * 2;
        const delay = Math.random() * duration;
        p.style.cssText = `
          left:${left}px;
          --drift:${drift}px;
          animation-duration:${duration}s;
          animation-delay:${delay}s;
        `;
        container.appendChild(p);
      }
    } else {
      shimmer.style.opacity = '0';
    }
  }

  // ===== UPDATE VISUAL STATE =====
  function updateVisuals(T, Tamb) {
    const jetT = tempToJet(T);
    const color = jetColorCSS(jetT);

    // Photo overlay with jet color
    document.getElementById('photoOverlay').style.backgroundColor = color;

    // Glow overlay for brightness
    const glowIntensity = jetT;
    if (jetT > 0.5) {
      document.getElementById('photoGlow').style.backgroundColor =
        `rgba(255, ${Math.round(200 - glowIntensity * 100)}, ${Math.round(50)}, ${(glowIntensity - 0.5) * 0.6})`;
    } else {
      document.getElementById('photoGlow').style.backgroundColor =
        `rgba(50, 100, 255, ${(0.5 - glowIntensity) * 0.4})`;
    }

    // Photo wrapper border glow
    const wrapper = document.getElementById('photoWrapper');
    if (jetT > 0.7) {
      wrapper.style.borderColor = color;
      wrapper.style.boxShadow = `0 8px 32px rgba(0,0,0,0.25), 0 0 ${20 + jetT * 30}px ${color}`;
    } else if (jetT < 0.2) {
      wrapper.style.borderColor = color;
      wrapper.style.boxShadow = `0 8px 32px rgba(0,0,0,0.25), 0 0 ${15}px rgba(100,150,255,0.3)`;
    } else {
      wrapper.style.borderColor = 'rgba(255,255,255,0.3)';
      wrapper.style.boxShadow = '0 8px 32px rgba(0,0,0,0.25)';
    }

    // Temp badge
    const badge = document.getElementById('tempBadge');
    badge.textContent = T.toFixed(1) + '°C';

    // Ambient background
    document.getElementById('ambientBg').style.backgroundColor = ambientBgColor(Tamb);

    // Ambient label
    const lbl = document.getElementById('ambientLabel');
    lbl.textContent = `Ambient: ${Tamb}°C`;
    lbl.classList.toggle('dark-text', ambientTextDark(Tamb));

    // Object name
    const sel = document.getElementById('objectSelect').value;
    document.getElementById('objectNameLabel').textContent = PRESETS[sel].name.toUpperCase();

    // Particles
    updateParticles(T, Tamb);

    // Info cards
    document.getElementById('infoCurrentTemp').textContent = T.toFixed(1) + '°C';
    const rate = -getK() * (T - Tamb);
    document.getElementById('infoRate').textContent = rate.toFixed(2) + '°C/min';
  }

  // ===== PLOTLY GRAPH =====
  function initPlot() {
    const Tamb = getAmbient();
    const endT = getEndTime();
    Plotly.newPlot('plotDiv', [
      {
        x: [], y: [],
        mode: 'lines',
        name: 'Numerical (Euler)',
        line: { color: '#2563eb', width: 3 },
        hovertemplate: '<b>t = %{x:.1f} min</b><br>T = %{y:.2f}°C<extra></extra>'
      },
      {
        x: [], y: [],
        mode: 'lines',
        name: 'Analytical',
        line: { color: '#f59e0b', width: 2, dash: 'dot' },
        hovertemplate: '<b>t = %{x:.1f} min</b><br>T = %{y:.2f}°C<extra></extra>'
      },
      {
        x: [0, endT], y: [Tamb, Tamb],
        mode: 'lines',
        name: 'Ambient',
        line: { color: '#94a3b8', width: 1.5, dash: 'dash' },
        hoverinfo: 'skip'
      }
    ], {
      xaxis: {
        title: { text: 'Time (min)', font: { size: 13 } },
        range: [0, endT],
        gridcolor: '#f1f5f9',
        zeroline: false,
      },
      yaxis: {
        title: { text: 'Temperature (°C)', font: { size: 13 } },
        gridcolor: '#f1f5f9',
        zeroline: false,
      },
      margin: { t: 30, r: 30, b: 55, l: 60 },
      legend: {
        x: 1, y: 1, xanchor: 'right',
        bgcolor: 'rgba(255,255,255,0.85)',
        bordercolor: '#e2e8f0', borderwidth: 1,
        font: { size: 11 }
      },
      hovermode: 'x unified',
      plot_bgcolor: '#fefefe',
      paper_bgcolor: 'transparent',
      font: { family: 'Segoe UI, system-ui, sans-serif' },
    }, {
      responsive: true,
      displayModeBar: true,
      modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'],
      displaylogo: false,
    });
  }

  // ===== HELPERS =====
  function getT0()      { return parseFloat(document.getElementById('initTemp').value); }
  function getAmbient()  { return parseFloat(document.getElementById('ambientTemp').value); }
  function getK()        { return parseFloat(document.getElementById('kConstant').value); }
  function getEndTime()  { return parseFloat(document.getElementById('endTime').value); }
  function getDt()       { return parseFloat(document.getElementById('dt').value); }
  function getSpeed()    { return parseInt(document.getElementById('speedSlider').value); }

  // ===== SIMULATION =====
  function startSimulation() {
    if (simState.running && !simState.paused) return;

    if (!simState.running) {
      const T0 = getT0();
      const Tamb = getAmbient();
      simState.times = [0];
      simState.temps = [T0];
      simState.analyticalTemps = [T0];
      simState.currentTime = 0;
      simState.currentTemp = T0;
      simState.running = true;
      simState.paused = false;

      initPlot();
      Plotly.extendTraces('plotDiv', {
        x: [[0], [0]], y: [[T0], [T0]]
      }, [0, 1]);

      updateVisuals(T0, Tamb);
      document.getElementById('infoTime').textContent = '0.0 min';
    }

    simState.paused = false;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('pauseBtn').innerHTML = '&#10074;&#10074; Pause';
    updateStatus('running', 'Simulating...');

    simState.lastFrameTime = performance.now();
    simState.animFrame = requestAnimationFrame(stepSimulation);
  }

  function stepSimulation(timestamp) {
    if (!simState.running || simState.paused) return;

    const dt = getDt();
    const k = getK();
    const Tamb = getAmbient();
    const endTime = getEndTime();
    const speed = getSpeed();

    const realDt = (timestamp - simState.lastFrameTime) / 1000;
    simState.lastFrameTime = timestamp;

    const stepsPerFrame = Math.max(1, Math.round(speed * realDt / dt * 10));

    let newTimes = [], newTemps = [], newAnalytical = [];

    for (let s = 0; s < stepsPerFrame && simState.currentTime < endTime; s++) {
      const dTdt = -k * (simState.currentTemp - Tamb);
      simState.currentTemp += dt * dTdt;
      simState.currentTime += dt;

      const T0 = getT0();
      const Tanalytical = Tamb + (T0 - Tamb) * Math.exp(-k * simState.currentTime);

      newTimes.push(simState.currentTime);
      newTemps.push(simState.currentTemp);
      newAnalytical.push(Tanalytical);

      simState.times.push(simState.currentTime);
      simState.temps.push(simState.currentTemp);
      simState.analyticalTemps.push(Tanalytical);
    }

    if (newTimes.length > 0) {
      Plotly.extendTraces('plotDiv', {
        x: [newTimes, newTimes],
        y: [newTemps, newAnalytical]
      }, [0, 1]);

      updateVisuals(simState.currentTemp, Tamb);
      document.getElementById('infoTime').textContent = simState.currentTime.toFixed(1) + ' min';
    }

    if (simState.currentTime >= endTime) {
      simState.running = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      updateStatus('idle', `Complete — ${simState.times.length} steps computed`);
      return;
    }

    simState.animFrame = requestAnimationFrame(stepSimulation);
  }

  function togglePause() {
    if (!simState.running) return;
    simState.paused = !simState.paused;
    const btn = document.getElementById('pauseBtn');

    if (simState.paused) {
      btn.innerHTML = '&#9654; Resume';
      updateStatus('paused', 'Paused');
      cancelAnimationFrame(simState.animFrame);
    } else {
      btn.innerHTML = '&#10074;&#10074; Pause';
      updateStatus('running', 'Simulating...');
      simState.lastFrameTime = performance.now();
      simState.animFrame = requestAnimationFrame(stepSimulation);
    }
  }

  function resetSimulation() {
    cancelAnimationFrame(simState.animFrame);
    simState.running = false;
    simState.paused = false;

    document.getElementById('startBtn').disabled = false;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('pauseBtn').innerHTML = '&#10074;&#10074; Pause';

    const T0 = getT0();
    const Tamb = getAmbient();

    initPlot();
    updateVisuals(T0, Tamb);

    document.getElementById('infoCurrentTemp').textContent = '—';
    document.getElementById('infoTime').textContent = '—';
    document.getElementById('infoRate').textContent = '—';
    updateStatus('idle', 'Ready — press Start to begin');
  }

  function updateStatus(state, text) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    dot.className = 'status-dot ' + (state === 'running' ? 'running' : state === 'paused' ? 'paused' : '');
    txt.textContent = text;
  }

  // ===== PRESET HANDLING =====
  function applyPreset(key) {
    const p = PRESETS[key];
    document.getElementById('objectSelect').value = key;
    document.getElementById('initTemp').value = p.T0;
    document.getElementById('kConstant').value = p.k;
    document.getElementById('ambientTemp').value = p.Tamb;

    document.querySelectorAll('.preset-pill').forEach(el => {
      el.classList.toggle('active', el.dataset.key === key);
    });

    setPhoto(key);
    updateVisuals(p.T0, p.Tamb);
    if (!simState.running) {
      initPlot();
      document.getElementById('infoCurrentTemp').textContent = '—';
      document.getElementById('infoTime').textContent = '—';
      document.getElementById('infoRate').textContent = '—';
    }
  }

  function buildPresetPills() {
    const row = document.getElementById('presetPills');
    row.innerHTML = '';
    for (const [key, p] of Object.entries(PRESETS)) {
      const pill = document.createElement('button');
      pill.className = 'preset-pill' + (key === 'coffee' ? ' active' : '');
      pill.dataset.key = key;
      pill.textContent = p.name;
      pill.onclick = () => applyPreset(key);
      row.appendChild(pill);
    }
  }

  document.getElementById('objectSelect').addEventListener('change', function() {
    applyPreset(this.value);
  });

  document.getElementById('speedSlider').addEventListener('input', function() {
    document.getElementById('speedValue').textContent = this.value + '\u00d7';
  });

  // ===== KaTeX =====
  function renderEquation() {
    const bar = document.getElementById('equationBar');
    try {
      katex.render(
        '\\dfrac{dT}{dt} = -k\\,(T - T_{\\text{env}}), \\qquad T(t) = T_{\\text{env}} + (T_0 - T_{\\text{env}})\\,e^{-kt}',
        bar,
        { displayMode: true, throwOnError: false }
      );
    } catch (e) {
      bar.innerHTML = '<em>dT/dt = &minus;k(T &minus; T<sub>env</sub>)</em>';
    }
  }

  // ===== INIT =====
  window.addEventListener('DOMContentLoaded', () => {
    buildPresetPills();

    const tryRender = () => {
      if (typeof katex !== 'undefined') renderEquation();
      else setTimeout(tryRender, 100);
    };
    tryRender();

    setPhoto('coffee');
    updateVisuals(getT0(), getAmbient());
    initPlot();
  });
  </script>
</body>
</html>
