<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit Counter Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
:root{--bg:#f0f2f5;--card:#fff;--txt:#111827;--txt2:#374151;--blue:#1d4ed8;--bl2:#1e3a8a;--bdr2:#d1d5db;--r:.5rem;}
*,*::before,*::after{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--txt);margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;line-height:1.6;}
.card{background:var(--card);padding:1.5rem;border-radius:.75rem;max-width:800px;width:100%;margin:2rem auto;}
h1{font-size:1.5rem;font-weight:800;text-align:center;margin:0 0 .25rem;}
.subtitle{font-size:.875rem;color:var(--txt2);text-align:center;margin-bottom:1rem;}
.total{text-align:center;font-size:2rem;font-weight:800;color:var(--blue);margin-bottom:1rem;}
.total span{font-size:.875rem;font-weight:600;color:var(--txt2);}
table{width:100%;border-collapse:collapse;font-size:.8125rem;}
th{text-align:left;padding:.4rem .5rem;background:var(--bg);border-bottom:2px solid var(--bdr2);font-weight:700;color:var(--txt2);}
td{padding:.35rem .5rem;border-bottom:1px solid var(--bdr2);word-break:break-all;}
tr:hover{background:rgba(29,78,216,.04);}
.cnt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.zero{color:#9ca3af;}
.bar{display:inline-block;height:14px;background:var(--blue);border-radius:3px;vertical-align:middle;opacity:.7;min-width:2px;}
.controls{display:flex;justify-content:center;gap:.5rem;margin-bottom:1rem;}
.btn{padding:.4rem 1rem;border:none;border-radius:var(--r);font-size:.8125rem;font-weight:700;cursor:pointer;min-height:36px;}
.btn-reset{background:#dc2626;color:#fff;}.btn-reset:hover{background:#b91c1c;}
.btn-refresh{background:var(--blue);color:#fff;}.btn-refresh:hover{background:var(--bl2);}
  </style>
</head>
<body>
<div class="card">
  <h1>Visit Counter Dashboard</h1>
  <p class="subtitle">Page visit counts from localStorage</p>
  <div class="controls">
    <button class="btn btn-refresh" onclick="render()">Refresh</button>
    <button class="btn btn-reset" onclick="if(confirm('Reset all counters?')){keys.forEach(function(k){localStorage.removeItem(k.key);});render();}">Reset All</button>
  </div>
  <div class="total" id="total"></div>
  <table>
    <thead><tr><th style="width:55%;">Page</th><th style="text-align:right;width:15%;">Visits</th><th style="width:30%;"></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<script>
var keys=[
  {key:'_sk_vc',label:'index.html'},
  {key:'_sk_vc_bifurcation',label:'bifurcation.html'},
  {key:'_sk_vc_bisection',label:'bisection.html'},
  {key:'_sk_vc_changebasis',label:'changebasis.html'},
  {key:'_sk_vc_changebasisviz',label:'changebasisviz.html'},
  {key:'_sk_vc_choleskyfactors',label:'choleskyfactors.html'},
  {key:'_sk_vc_cobweb',label:'cobweb.html'},
  {key:'_sk_vc_convolution',label:'convolution.html'},
  {key:'_sk_vc_cooling',label:'cooling.html'},
  {key:'_sk_vc_corners',label:'corners.html'},
  {key:'_sk_vc_corners_v1',label:'corners_v1.html'},
  {key:'_sk_vc_coupled',label:'coupled.html'},
  {key:'_sk_vc_cr',label:'cr.html'},
  {key:'_sk_vc_cv',label:'cv.html'},
  {key:'_sk_vc_determinants',label:'determinants.html'},
  {key:'_sk_vc_diag',label:'diag.html'},
  {key:'_sk_vc_double_potential',label:'double_potential.html'},
  {key:'_sk_vc_eigenvalues-eigenvectors',label:'eigenvalues-eigenvectors.html'},
  {key:'_sk_vc_elastic_pendulum',label:'elastic_pendulum.html'},
  {key:'_sk_vc_elementary',label:'elementary.html'},
  {key:'_sk_vc_epl',label:'epl.html'},
  {key:'_sk_vc_ffs',label:'ffs.html'},
  {key:'_sk_vc_finitediff',label:'finitediff.html'},
  {key:'_sk_vc_forcing',label:'forcing.html'},
  {key:'_sk_vc_fourier',label:'fourier.html'},
  {key:'_sk_vc_generalizedinverse',label:'generalizedinverse.html'},
  {key:'_sk_vc_geometry2d',label:'geometry2d.html'},
  {key:'_sk_vc_gradecalc',label:'gradecalc.html'},
  {key:'_sk_vc_gramschmidtorthogonal',label:'gramschmidtorthogonal.html'},
  {key:'_sk_vc_interpolation',label:'interpolation.html'},
  {key:'_sk_vc_inversematrix',label:'inversematrix.html'},
  {key:'_sk_vc_laplace',label:'laplace.html'},
  {key:'_sk_vc_leastsquaresdata',label:'leastsquaresdata.html'},
  {key:'_sk_vc_leastsquaresnormaleqns',label:'leastsquaresnormaleqns.html'},
  {key:'_sk_vc_leastsquaresqr',label:'leastsquaresqr.html'},
  {key:'_sk_vc_leastsquaresrational',label:'leastsquaresrational.html'},
  {key:'_sk_vc_leastsquaressvd',label:'leastsquaressvd.html'},
  {key:'_sk_vc_linear',label:'linear.html'},
  {key:'_sk_vc_lineareqn',label:'lineareqn.html'},
  {key:'_sk_vc_linearequation',label:'linearequation.html'},
  {key:'_sk_vc_linearportrait',label:'linearportrait.html'},
  {key:'_sk_vc_lineartransform',label:'lineartransform.html'},
  {key:'_sk_vc_lorenzsystem',label:'lorenzsystem.html'},
  {key:'_sk_vc_lotkavolterra',label:'lotkavolterra.html'},
  {key:'_sk_vc_lufactor',label:'lufactor.html'},
  {key:'_sk_vc_lvcarrying',label:'lvcarrying.html'},
  {key:'_sk_vc_magicfactors',label:'magicfactors.html'},
  {key:'_sk_vc_massspring',label:'massspring.html'},
  {key:'_sk_vc_massspring-horizontal',label:'massspring-horizontal.html'},
  {key:'_sk_vc_mathjs',label:'mathjs.html'},
  {key:'_sk_vc_multi_pendulum',label:'multi_pendulum.html'},
  {key:'_sk_vc_newton',label:'newton.html'},
  {key:'_sk_vc_nonlinear',label:'nonlinear.html'},
  {key:'_sk_vc_nonlinearphaseportraits',label:'nonlinearphaseportraits.html'},
  {key:'_sk_vc_numerical',label:'numerical.html'},
  {key:'_sk_vc_office2pdf',label:'office2pdf.html'},
  {key:'_sk_vc_optim',label:'optim.html'},
  {key:'_sk_vc_pdf_dark',label:'pdf_dark.html'},
  {key:'_sk_vc_pdf_manager',label:'pdf_manager.html'},
  {key:'_sk_vc_pdf_sort',label:'pdf_sort.html'},
  {key:'_sk_vc_pdftools',label:'pdftools.html'},
  {key:'_sk_vc_pend',label:'pend.html'},
  {key:'_sk_vc_pendulum_simulator',label:'pendulum_simulator.html'},
  {key:'_sk_vc_pendulum_wave',label:'pendulum_wave.html'},
  {key:'_sk_vc_phaseline',label:'phaseline.html'},
  {key:'_sk_vc_plotfunction',label:'plotfunction.html'},
  {key:'_sk_vc_potential',label:'potential.html'},
  {key:'_sk_vc_prod',label:'prod.html'},
  {key:'_sk_vc_projects',label:'projects.html'},
  {key:'_sk_vc_qrfactor',label:'qrfactor.html'},
  {key:'_sk_vc_refsolver',label:'refsolver.html'},
  {key:'_sk_vc_rref',label:'rref.html'},
  {key:'_sk_vc_rrefsolver',label:'rrefsolver.html'},
  {key:'_sk_vc_seatallocator',label:'seatallocator.html'},
  {key:'_sk_vc_slope',label:'slope.html'},
  {key:'_sk_vc_slopev1',label:'slopev1.html'},
  {key:'_sk_vc_svd2d',label:'svd2d.html'},
  {key:'_sk_vc_svdcompute',label:'svdcompute.html'},
  {key:'_sk_vc_teaching',label:'teaching.html'},
  {key:'_sk_vc_timer',label:'timer.html'},
  {key:'_sk_vc_transformations2d',label:'transformations2d.html'},
  {key:'_sk_vc_counter',label:'counter.html'}
];
function render(){
  var total=0,rows=[];
  keys.forEach(function(k){
    var c=parseInt(localStorage.getItem(k.key)||'0',10);
    total+=c;
    rows.push({label:k.label,count:c});
  });
  rows.sort(function(a,b){return b.count-a.count;});
  var maxC=rows.length?rows[0].count:1;
  document.getElementById('total').innerHTML=total+'<br><span>total visits across '+keys.length+' pages</span>';
  var html='';
  rows.forEach(function(r){
    var barW=maxC>0?Math.round(r.count/maxC*100):0;
    var cls=r.count===0?'cnt zero':'cnt';
    html+='<tr><td>'+r.label+'</td><td class="'+cls+'">'+r.count+'</td><td><span class="bar" style="width:'+barW+'%"></span></td></tr>';
  });
  document.getElementById('tbody').innerHTML=html;
}
render();
/* self-count */
(function(){var k='_sk_vc_counter';var c=parseInt(localStorage.getItem(k)||'0',10)+1;localStorage.setItem(k,c);})();
</script>
</body>
</html>
