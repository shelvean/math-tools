    // Define the KaTeX rendering options globally
    const katexOptions = {
      delimiters: [
        {left: '\\[', right: '\\]', display: true}, // Block math
        {left: '\\(', right: '\\)', display: false} // Inline math
      ],
      throwOnError: false, // Don't stop rendering on error
      trust: true // Allow potentially unsafe commands if needed (use cautiously)
    };

    // Helper function to render math within a specific element (used for dynamic content)
    function renderKatexInElement(element) {
      if (element && typeof window.renderMathInElement === 'function') {
        try {
          window.renderMathInElement(element, katexOptions);
        } catch (error) {
          console.error("KaTeX rendering failed for element:", element, error);
        }
      } else if (!element) {
        console.warn("renderKatexInElement called with null element");
      } else if (typeof window.renderMathInElement !== 'function') {
        console.error("KaTeX auto-render script did not load 'renderMathInElement' function.");
      }
    }

    // Format number to show only significant digits (remove trailing zeros and unnecessary decimal point)
    function formatSignificant(number) {
      if (!Number.isFinite(number)) return String(number);
      let str = number.toFixed(10);
      str = str.replace(/\.?0+$/, '');
      return str;
    }

    // Parse input for decimals, fractions, and scientific notation
    function parseInput(input) {
      if (!input || typeof input !== 'string') return NaN;
      input = input.trim();
      if (input.includes('/')) {
        const [numerator, denominator] = input.split('/').map(s => s.trim());
        const num = parseFloat(numerator);
        const denom = parseFloat(denominator);
        if (!isNaN(num) && !isNaN(denom) && denom !== 0) {
          return parseFloat((num / denom).toFixed(10));
        }
      }
      const parsed = parseFloat(input);
      if (!isNaN(parsed)) {
        return parseFloat(parsed.toFixed(10));
      }
      return NaN;
    }
  </script>

  <h1>Lorenz System </h1>
  <div class="equations">
    \[
    \begin{cases}
      \dot{x} = \sigma(y - x) \\
      \dot{y} = x(\rho - z) - y \\
      \dot{z} = xy - \beta z
    \end{cases}
    \]

  <script>
    // Define parameters with KaTeX labels
    const params = [
      {id: 'sigma', label: '\\sigma', min: 1, max: 20, step: 0.01, value: 10},
      {id: 'rho', label: '\\rho', min: 0, max: 50, step: 0.000001, value: 28},
      {id: 'beta', label: '\\beta', min: 0.1, max: 5, step: 0.0000000001, value: 2.66666667},
      {id: 'x0', label: 'x₀', min: -20, max: 20, step: 0.0000000001, value: 1},
      {id: 'y0', label: 'y₀', min: -20, max: 20, step: 0.0000000001, value: 1},
      {id: 'z0', label: 'z₀', min: -20, max: 50, step: 0.0000000001, value: 20}
    ];

    // Track sensitivity mode state
    let sensitivityMode = false;

    // --- Lorenz Simulation Functions ---
    function lorenz(x, y, z, sigma, rho, beta) {
      return [
        sigma * (y - x),
        x * (rho - z) - y,
        x * y - beta * z
      ];
    }

    function solveLorenz(sigma, rho, beta, x0, y0, z0) {
      const dt = 0.005; // Reduced time step for higher accuracy
      const maxSteps = 30000; // Increased steps to maintain simulation duration
      const x_arr = new Array(maxSteps);
      const y_arr = new Array(maxSteps);
      const z_arr = new Array(maxSteps);
      const t_arr = new Array(maxSteps);
      let x = x0, y = y0, z = z0;
      for (let i = 0; i < maxSteps; ++i) {
        const [k1x, k1y, k1z] = lorenz(x, y, z, sigma, rho, beta);
        const [k2x, k2y, k2z] = lorenz(x + k1x * dt / 2, y + k1y * dt / 2, z + k1z * dt / 2, sigma, rho, beta);
        const [k3x, k3y, k3z] = lorenz(x + k2x * dt / 2, y + k2y * dt / 2, z + k2z * dt / 2, sigma, rho, beta);
        const [k4x, k4y, k4z] = lorenz(x + k3x * dt, y + k3y * dt, z + k3z * dt, sigma, rho, beta);
        x += (k1x + 2 * k2x + 2 * k3x + k4x) * dt / 6;
        y += (k1y + 2 * k2y + 2 * k3y + k4y) * dt / 6;
        z += (k1z + 2 * k2z + 2 * k3z + k4z) * dt / 6;
        x_arr[i] = x;
        y_arr[i] = y;
        z_arr[i] = z;
        t_arr[i] = i / maxSteps;
      }
      return {x: x_arr, y: y_arr, z: z_arr, t: t_arr};
    }

    // --- Dormand-Prince 5(4) Adaptive Solver ---
    // Butcher tableau coefficients
    const DP5_A = [
      [],
      [1/5],
      [3/40, 9/40],
      [44/45, -56/15, 32/9],
      [19372/6561, -25360/2187, 64448/6561, -212/729],
      [9017/3168, -355/33, 46732/5247, 49/176, -5103/18656],
      [35/384, 0, 500/1113, 125/192, -2187/6784, 11/84]
    ];
    const DP5_B  = [35/384, 0, 500/1113, 125/192, -2187/6784, 11/84, 0];
    const DP5_BS = [5179/57600, 0, 7571/16695, 393/640, -92097/339200, 187/2100, 1/40];
    const DP5_C  = [0, 1/5, 3/10, 4/5, 8/9, 1, 1];

    // Solve coupled Lorenz system: two trajectories as a 6D system
    // State: [x1, y1, z1, x2, y2, z2]
    function solveCoupledDP54(sigma, rho, beta, x0, y0, z0, epsilon, T, atol, rtol) {
      const n = 6;
      const y = [x0, y0, z0, x0 + epsilon, y0, z0];
      let t = 0;
      let h = 0.01;
      const maxSteps = 500000;

      const tNodes = [0];
      const yNodes = [y.slice()];

      function f(state) {
        const [dx1, dy1, dz1] = lorenz(state[0], state[1], state[2], sigma, rho, beta);
        const [dx2, dy2, dz2] = lorenz(state[3], state[4], state[5], sigma, rho, beta);
        return [dx1, dy1, dz1, dx2, dy2, dz2];
      }

      let fsal = f(y);
      let steps = 0;

      while (t < T && steps < maxSteps) {
        if (t + h > T) h = T - t;
        if (h < 1e-12) break;

        // Current state
        const yc = yNodes[yNodes.length - 1];

        // Stage 1 (FSAL)
        const k = [fsal];

        // Stages 2-7
        for (let s = 1; s < 7; s++) {
          const yi = new Array(n);
          for (let j = 0; j < n; j++) {
            yi[j] = yc[j];
            for (let l = 0; l < s; l++) {
              yi[j] += h * DP5_A[s][l] * k[l][j];
            }
          }
          k.push(f(yi));
        }

        // 5th order solution
        const yNew = new Array(n);
        for (let j = 0; j < n; j++) {
          yNew[j] = yc[j];
          for (let s = 0; s < 7; s++) {
            yNew[j] += h * DP5_B[s] * k[s][j];
          }
        }

        // Error estimation (difference between 5th and 4th order)
        let errMax = 0;
        for (let j = 0; j < n; j++) {
          let ej = 0;
          for (let s = 0; s < 7; s++) {
            ej += (DP5_B[s] - DP5_BS[s]) * k[s][j];
          }
          ej *= h;
          const scale = atol + rtol * Math.max(Math.abs(yc[j]), Math.abs(yNew[j]));
          errMax = Math.max(errMax, Math.abs(ej) / scale);
        }

        if (errMax <= 1.0) {
          // Accept step
          t += h;
          tNodes.push(t);
          yNodes.push(yNew);
          fsal = k[6]; // FSAL: k7 becomes k1 of next step
        }

        // Adjust step size (PI controller)
        const factor = Math.min(5.0, Math.max(0.2, 0.9 * Math.pow(errMax, -0.2)));
        h = Math.min(h * factor, 2.0);
        h = Math.max(h, 1e-12);
        steps++;
      }

      return { t: tNodes, y: yNodes };
    }

    // Interpolate adaptive solver output onto uniform time grid
    function interpolateUniform(tNodes, yNodes, N) {
      const n = yNodes[0].length;
      const tMax = tNodes[tNodes.length - 1];
      const dt = tMax / (N - 1);
      const tOut = new Array(N);
      const yOut = new Array(N);

      let j = 0;
      for (let i = 0; i < N; i++) {
        const ti = i * dt;
        tOut[i] = ti;

        // Advance to the right interval
        while (j < tNodes.length - 2 && tNodes[j + 1] < ti) j++;

        const span = tNodes[j + 1] - tNodes[j];
        const alpha = span > 0 ? (ti - tNodes[j]) / span : 0;
        const yi = new Array(n);
        for (let k = 0; k < n; k++) {
          yi[k] = yNodes[j][k] + alpha * (yNodes[j + 1][k] - yNodes[j][k]);
        }
        yOut[i] = yi;
      }

      return { t: tOut, y: yOut };
    }

    // Compute divergence and estimate Lyapunov exponent
    function computeDivergence(tArr, yArr) {
      const N = tArr.length;
      const dist = new Array(N);
      const logDist = new Array(N);

      for (let i = 0; i < N; i++) {
        const dx = yArr[i][0] - yArr[i][3];
        const dy = yArr[i][1] - yArr[i][4];
        const dz = yArr[i][2] - yArr[i][5];
        dist[i] = Math.sqrt(dx * dx + dy * dy + dz * dz);
        logDist[i] = Math.log10(Math.max(dist[i], 1e-20));
      }

      return { dist, logDist };
    }

    function estimateLyapunov(tArr, logDist) {
      // Fit a line through the exponential growth phase
      // Growth phase: from start until log10(distance) reaches ~1.0 (distance ~10, attractor diameter ~30)
      let endIdx = tArr.length - 1;
      for (let i = 1; i < tArr.length; i++) {
        if (logDist[i] > 1.0) {
          endIdx = i;
          break;
        }
      }
      // Need at least some points for a meaningful fit
      if (endIdx < 5) endIdx = Math.min(tArr.length - 1, 50);

      // Linear regression on [0, endIdx]
      let sumT = 0, sumL = 0, sumTL = 0, sumT2 = 0;
      const count = endIdx + 1;
      for (let i = 0; i <= endIdx; i++) {
        sumT += tArr[i];
        sumL += logDist[i];
        sumTL += tArr[i] * logDist[i];
        sumT2 += tArr[i] * tArr[i];
      }

      const denom = count * sumT2 - sumT * sumT;
      if (Math.abs(denom) < 1e-20) return { lambda1: NaN, slope: 0, intercept: 0, endTime: tArr[endIdx] };

      const slope = (count * sumTL - sumT * sumL) / denom;
      const intercept = (sumL - slope * sumT) / count;
      const lambda1 = slope * Math.LN10; // Convert log10 slope to natural log rate

      return { lambda1, slope, intercept, endTime: tArr[endIdx] };
    }

    // --- Utility Functions ---
    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // --- Shared Plot Layout ---
    function make3DLayout(title) {
      return {
        title: title,
        scene: {
          xaxis: {title: 'X Axis', gridcolor: '#a0a0a0', linecolor: '#000000'},
          yaxis: {title: 'Y Axis', gridcolor: '#a0a0a0', linecolor: '#000000'},
          zaxis: {title: 'Z Axis', gridcolor: '#a0a0a0', linecolor: '#000000'},
          camera: { eye: {x: 2.18, y: 0, z: 0} },
          bgcolor: '#ffffff'
        },
        margin: {t: 40, b: 20, l: 0, r: 0},
        paper_bgcolor: '#ffffff',
        font: {color: '#000000'},
        hovermode: false,
        uirevision: 'true',
        renderer: 'webgl',
        antialias: false
      };
    }

    // --- Plotting Functions ---
    const updatePlot = debounce(function (rhoOverride = null) {
      if (sensitivityMode) {
        updateSensitivityPlot(rhoOverride);
        return;
      }

      const values = params.reduce((acc, param) => {
        const element = document.getElementById(param.id);
        if (element) {
          acc[param.id] = parseFloat(element.value);
        } else {
          console.warn(`Element not found for param ID: ${param.id} during plot update.`);
          acc[param.id] = param.value;
        }
        return acc;
      }, {});

      if (rhoOverride !== null) {
        values.rho = rhoOverride;
        const rhoSlider = document.getElementById('rho');
        const rhoInput = document.getElementById('rhoValue');
        if (rhoSlider && rhoInput) {
          rhoSlider.value = rhoOverride;
          rhoInput.value = formatSignificant(rhoOverride);
        }
      }

      if (values.sigma === undefined || values.rho === undefined || values.beta === undefined ||
          values.x0 === undefined || values.y0 === undefined || values.z0 === undefined) {
        console.error("One or more parameter values are missing for Lorenz calculation.");
        return;
      }

      const trajectory = solveLorenz(
        values.sigma, values.rho, values.beta,
        values.x0, values.y0, values.z0
      );

      Plotly.react('plot', [{
        x: trajectory.x,
        y: trajectory.y,
        z: trajectory.z,
        type: 'scatter3d',
        mode: 'lines',
        line: {
          color: trajectory.t,
          colorscale: 'Jet',
          width: 2,
          opacity: 1,
          showscale: true,
          cmin: 0,
          cmax: 1,
          colorbar: {
            title: 'Time Progression',
            thickness: 15,
            tickvals: [0, 0.5, 1],
            ticktext: ['Start', 'Mid', 'End']
          }
        }
      }], make3DLayout(`Lorenz Attractor (\u03C1 = ${formatSignificant(values.rho)})`));
    }, 100);

    // --- Sensitivity Mode Plotting ---
    function updateSensitivityPlot(rhoOverride = null) {
      const values = params.reduce((acc, param) => {
        const element = document.getElementById(param.id);
        if (element) {
          acc[param.id] = parseFloat(element.value);
        } else {
          acc[param.id] = param.value;
        }
        return acc;
      }, {});

      if (rhoOverride !== null) {
        values.rho = rhoOverride;
        const rhoSlider = document.getElementById('rho');
        const rhoInput = document.getElementById('rhoValue');
        if (rhoSlider && rhoInput) {
          rhoSlider.value = rhoOverride;
          rhoInput.value = formatSignificant(rhoOverride);
        }
      }

      const epsInput = document.getElementById('epsilonInput');
      const tInput = document.getElementById('intTimeInput');
      const epsilon = epsInput ? parseFloat(epsInput.value) || 1e-6 : 1e-6;
      const T = tInput ? parseFloat(tInput.value) || 50 : 50;

      // Solve coupled system with DP5(4)
      const result = solveCoupledDP54(
        values.sigma, values.rho, values.beta,
        values.x0, values.y0, values.z0,
        epsilon, T, 1e-10, 1e-8
      );

      // Interpolate onto uniform grid for plotting
      const N = 5000;
      const interp = interpolateUniform(result.t, result.y, N);

      // Extract trajectories
      const x1 = new Array(N), y1 = new Array(N), z1 = new Array(N);
      const x2 = new Array(N), y2 = new Array(N), z2 = new Array(N);
      for (let i = 0; i < N; i++) {
        x1[i] = interp.y[i][0]; y1[i] = interp.y[i][1]; z1[i] = interp.y[i][2];
        x2[i] = interp.y[i][3]; y2[i] = interp.y[i][4]; z2[i] = interp.y[i][5];
      }

      // Compute divergence
      const { logDist } = computeDivergence(interp.t, interp.y);
      const lyap = estimateLyapunov(interp.t, logDist);

      // Update solver stats
      const statsEl = document.getElementById('solverStats');
      if (statsEl) {
        statsEl.textContent = `DP5(4): ${result.t.length} steps | \u03BB\u2081 \u2248 ${isNaN(lyap.lambda1) ? '---' : lyap.lambda1.toFixed(4)}`;
      }

      // 3D plot with two trajectories
      const tNorm = interp.t.map(v => v / T);
      Plotly.react('plot', [
        {
          x: x1, y: y1, z: z1,
          type: 'scatter3d', mode: 'lines',
          name: 'Primary',
          line: {
            color: tNorm, colorscale: 'Blues', width: 2, opacity: 1,
            showscale: false
          }
        },
        {
          x: x2, y: y2, z: z2,
          type: 'scatter3d', mode: 'lines',
          name: `Perturbed (\u03B5 = ${epsilon.toExponential(1)})`,
          line: {
            color: tNorm, colorscale: 'Reds', width: 2, opacity: 1,
            showscale: true, cmin: 0, cmax: 1,
            colorbar: {
              title: 'Time (t)', thickness: 15,
              tickvals: [0, 0.5, 1],
              ticktext: [formatSignificant(0), formatSignificant(T / 2), formatSignificant(T)]
            }
          }
        }
      ], make3DLayout(
        `Sensitive Dependence (\u03C1 = ${formatSignificant(values.rho)}, \u03BB\u2081 \u2248 ${isNaN(lyap.lambda1) ? '---' : lyap.lambda1.toFixed(3)})`
      ));

      // Divergence plot
      const divPlot = document.getElementById('divergence-plot');
      divPlot.style.display = 'block';

      // Build fit line over the growth phase
      const fitT = [interp.t[0], lyap.endTime];
      const fitLog = [lyap.intercept + lyap.slope * fitT[0], lyap.intercept + lyap.slope * fitT[1]];

      Plotly.react('divergence-plot', [
        {
          x: interp.t,
          y: logDist,
          type: 'scatter',
          mode: 'lines',
          name: 'log\u2081\u2080 ||\u03B4(t)||',
          line: { color: '#2ecc71', width: 2 }
        },
        {
          x: fitT,
          y: fitLog,
          type: 'scatter',
          mode: 'lines',
          name: `Fit: \u03BB\u2081 \u2248 ${isNaN(lyap.lambda1) ? '---' : lyap.lambda1.toFixed(4)}`,
          line: { color: '#e74c3c', width: 2, dash: 'dash' }
        }
      ], {
        title: 'Trajectory Divergence',
        xaxis: { title: 'Time (t)', gridcolor: '#e0e0e0', zeroline: false },
        yaxis: { title: 'log\u2081\u2080 ||\u03B4(t)||', gridcolor: '#e0e0e0', zeroline: false },
        margin: { t: 40, b: 50, l: 60, r: 20 },
        paper_bgcolor: '#ffffff',
        plot_bgcolor: '#ffffff',
        font: { color: '#000000' },
        legend: { x: 0.02, y: 0.98, bgcolor: 'rgba(255,255,255,0.8)' },
        hovermode: 'x unified'
      });
    }

    // --- UI Creation Function ---
    function createSliders() {
      const container = document.querySelector('.controls');
      if (!container) {
        console.error("Slider container '.controls' not found.");
        return;
      }
      container.innerHTML = `
        <div class="instruction">Enter values manually or use sliders:</div>
        ${params.map(param => `
          <div class="slider-container">
            <div class="slider-label">
              <span>\\(${param.label}\\)</span>
              <input type="text" id="${param.id}Value" class="slider-value" value="${formatSignificant(param.value)}">
            </div>
            <input type="range" id="${param.id}" min="${param.min}" max="${param.max}" step="${param.step}" value="${param.value}">
          </div>
        `).join('')}
        <div class="animation-controls">
          <div class="input-row">
            <div class="slider-label">
              <span>FPS</span>
              <input type="number" id="fps" class="slider-value" value="3" min="1" max="60" step="1">
            </div>
            <div class="slider-label">
              <span>\\(\\rho_{start}\\)</span>
              <input type="number" id="rhoStart" class="slider-value" value="18" min="0" max="50" step="0.1">
            </div>
            <div class="slider-label">
              <span>\\(\\rho_{end}\\)</span>
              <input type="number" id="rhoEnd" class="slider-value" value="23" min="0" max="50" step="0.1">
            </div>
          </div>
          <div class="button-row">
            <button id="animateBtn">Animate Rho</button>
            <button class="transient-chaos-btn">Transient Chaos</button>
          </div>
        </div>
        <div class="sensitivity-controls">
          <span class="section-label">Sensitivity Analysis (DP5(4))</span>
          <div class="input-row">
            <div class="slider-label">
              <span>\\(\\varepsilon\\)</span>
              <input type="text" id="epsilonInput" class="slider-value" value="1e-6">
            </div>
            <div class="slider-label">
              <span>\\(T\\)</span>
              <input type="number" id="intTimeInput" class="slider-value" value="50" min="1" max="200" step="1">
            </div>
          </div>
          <div class="button-row">
            <button id="sensitivityBtn">Sensitivity Mode</button>
          </div>
          <span id="solverStats" style="font-size:0.8rem; color:#888;"></span>
        </div>
      `;
      renderKatexInElement(container); // Render KaTeX for slider labels
    }

    // --- Initialization on DOM Ready ---
    document.addEventListener('DOMContentLoaded', () => {
      try {
        if (typeof window.renderMathInElement === 'function') {
          window.renderMathInElement(document.body, katexOptions); // Render static KaTeX
          const equationsDiv = document.querySelector('.equations');
          if (equationsDiv) {
            equationsDiv.classList.add('rendered');
          }
        } else {
          console.error("KaTeX auto-render function 'renderMathInElement' not found.");
        }
      } catch (error) {
        console.error("Initial KaTeX rendering failed:", error);
      }

      createSliders(); // Create sliders (calls KaTeX render internally)

      // Setup event listeners
      params.forEach(param => {
        const slider = document.getElementById(param.id);
        const input = document.getElementById(`${param.id}Value`);
        if (slider && input) {
          slider.addEventListener('input', function () {
            const value = parseFloat(this.value);
            input.value = Number.isFinite(value) ? formatSignificant(value) : formatSignificant(param.value);
            updatePlot();
          });
          input.addEventListener('change', function () {
            let newValue = parseInput(this.value);
            const minVal = parseFloat(param.min);
            const maxVal = parseFloat(param.max);
            const stepVal = parseFloat(param.step);
            // Use default value if parsing fails
            if (isNaN(newValue)) {
              newValue = param.value;
            }
            // Clamp to min/max
            newValue = Math.max(minVal, Math.min(maxVal, newValue));
            // Snap to step
            if (stepVal > 0) {
              let numSteps = Math.round((newValue - minVal) / stepVal);
              newValue = minVal + numSteps * stepVal;
              newValue = parseFloat(newValue.toFixed(10));
            }
            // Ensure final clamp
            newValue = Math.max(minVal, Math.min(maxVal, newValue));
            // Update slider and input
            slider.value = newValue;
            input.value = formatSignificant(newValue);
            updatePlot();
          });
        } else {
          console.warn(`Could not find slider or input for parameter: ${param.id}`);
        }
      });

      // Animation setup
      const animateBtn = document.getElementById('animateBtn');
      const fpsInput = document.getElementById('fps');
      const rhoStartInput = document.getElementById('rhoStart');
      const rhoEndInput = document.getElementById('rhoEnd');
      let animationId = null;

      animateBtn.addEventListener('click', () => {
        if (animationId) {
          clearTimeout(animationId);
          animationId = null;
          animateBtn.textContent = 'Animate Rho';
          return;
        }
        animateBtn.textContent = 'Stop Animation';
        const fps = parseInt(fpsInput.value) || 10;
        const delay = 1000 / fps;
        const rhoSlider = document.getElementById('rho');
        const rhoInput = document.getElementById('rhoValue');
        const sigma = parseFloat(document.getElementById('sigma').value);
        const beta = parseFloat(document.getElementById('beta').value);
        const x0 = parseFloat(document.getElementById('x0').value);
        const y0 = parseFloat(document.getElementById('y0').value);
        const z0 = parseFloat(document.getElementById('z0').value);
        let rhoStart = parseFloat(rhoStartInput.value) || 1.0;
        let rhoEnd = parseFloat(rhoEndInput.value) || 38.0;

        // Ensure rhoStart <= rhoEnd
        if (rhoStart > rhoEnd) {
          [rhoStart, rhoEnd] = [rhoEnd, rhoStart];
          rhoStartInput.value = formatSignificant(rhoStart);
          rhoEndInput.value = formatSignificant(rhoEnd);
        }

        let currentRho = rhoStart;
        const rhoStep = 0.1; // Fixed step size for animation

        const animate = () => {
          if (currentRho > rhoEnd + 0.0001) {
            clearTimeout(animationId);
            animationId = null;
            animateBtn.textContent = 'Animate Rho';
            return;
          }
          // Update rho slider and input
          rhoSlider.value = currentRho;
          rhoInput.value = formatSignificant(currentRho);

          if (sensitivityMode) {
            // In sensitivity mode, use DP5(4) coupled solver
            updateSensitivityPlot(currentRho);
          } else {
            // Original single-trajectory animation
            const trajectory = solveLorenz(sigma, currentRho, beta, x0, y0, z0);
            Plotly.react('plot', [{
              x: trajectory.x,
              y: trajectory.y,
              z: trajectory.z,
              type: 'scatter3d',
              mode: 'lines',
              line: {
                color: trajectory.t,
                colorscale: 'Jet',
                width: 4,
                opacity: 1,
                showscale: true,
                cmin: 0,
                cmax: 1,
                colorbar: {
                  title: 'Time Progression',
                  thickness: 15,
                  tickvals: [0, 0.5, 1],
                  ticktext: ['Start', 'Mid', 'End']
                }
              }
            }], make3DLayout(`Lorenz Attractor (\u03C1 = ${formatSignificant(currentRho)})`));
          }

          currentRho += rhoStep;
          currentRho = Math.round(currentRho * 10) / 10;
          animationId = setTimeout(animate, delay);
        };
        animate();
      });

      // Event listeners for rho start and end inputs
      [rhoStartInput, rhoEndInput].forEach(input => {
        input.addEventListener('change', function () {
          let newValue = parseFloat(this.value);
          const minVal = 0;
          const maxVal = 50;
          const stepVal = 0.1;
          // Use default value if parsing fails
          if (isNaN(newValue)) {
            newValue = this.id === 'rhoStart' ? 1.0 : 38.0;
          }
          // Clamp to min/max
          newValue = Math.max(minVal, Math.min(maxVal, newValue));
          // Snap to step
          if (stepVal > 0) {
            let numSteps = Math.round((newValue - minVal) / stepVal);
            newValue = minVal + numSteps * stepVal;
            newValue = parseFloat(newValue.toFixed(10));
          }
          // Update input
          this.value = formatSignificant(newValue);
        });
      });

      // Transient chaos button event listener
      const transientChaosBtn = document.querySelector('.transient-chaos-btn');
      transientChaosBtn.addEventListener('click', () => {
        // Stop any ongoing animation
        if (animationId) {
          clearTimeout(animationId);
          animationId = null;
          animateBtn.textContent = 'Animate Rho';
        }
        // Update plot with rho = 22.0
        updatePlot(22.0);
      });

      // Sensitivity mode toggle
      const sensitivityBtn = document.getElementById('sensitivityBtn');
      sensitivityBtn.addEventListener('click', () => {
        sensitivityMode = !sensitivityMode;
        if (sensitivityMode) {
          sensitivityBtn.textContent = 'Standard Mode';
          sensitivityBtn.classList.add('sensitivity-active');
          updatePlot();
        } else {
          sensitivityBtn.textContent = 'Sensitivity Mode';
          sensitivityBtn.classList.remove('sensitivity-active');
          document.getElementById('divergence-plot').style.display = 'none';
          const statsEl = document.getElementById('solverStats');
          if (statsEl) statsEl.textContent = '';
          updatePlot();
        }
      });

      // Sensitivity parameter change listeners
      const epsilonInput = document.getElementById('epsilonInput');
      const intTimeInput = document.getElementById('intTimeInput');
      [epsilonInput, intTimeInput].forEach(input => {
        input.addEventListener('change', () => {
          if (sensitivityMode) updatePlot();
        });
      });

      updatePlot(); // Initial plot render
    });
  </script>
</body>

</html>
